<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Emoji Maker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0e1a;
            --card-bg: rgba(30, 30, 40, 0.75);
            --text-color: #ffffff;
            --accent-color: #5b6cf9;
            --accent-gradient: linear-gradient(135deg, #5b6cf9, #3a4bd6);
            --secondary-text: #8e8e93;
        }
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 80px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        #waves-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            display: block;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(10, 14, 26, 0.3) 0%, rgba(10, 14, 26, 0.85) 100%);
            pointer-events: none;
        }
        .header { text-align: center; margin-bottom: 24px; margin-top: 8px; }
        .header h1 { font-size: 20px; font-weight: 600; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(91, 108, 249, 0.15);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--secondary-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            background-color: rgba(44, 44, 53, 0.8);
            border: 1px solid rgba(91, 108, 249, 0.2);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--accent-color); }
        .input-field::placeholder { color: #555; }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-align: center;
            margin-top: 10px;
            box-shadow: 0 4px 16px rgba(91, 108, 249, 0.4);
        }
        .btn:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(91, 108, 249, 0.6); }
        .btn-secondary {
            background: rgba(44, 44, 53, 0.9);
            border: 1px solid rgba(91, 108, 249, 0.25);
            box-shadow: none;
        }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: rgba(26, 26, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(91, 108, 249, 0.15);
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--secondary-text); font-size: 11px; cursor: pointer;
            background: none; border: none; padding: 4px 12px;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

        .hidden { display: none !important; }
        .screen { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Сообщение об ошибке */
        #error-box {
            display: none;
            background: rgba(220, 50, 50, 0.9);
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <canvas id="waves-canvas"></canvas>
    <div class="overlay"></div>

    <div class="header">
        <h1 id="page-title">Создать эмодзи</h1>
    </div>

    <div id="error-box"></div>

    <!-- Экран "Создать" -->
    <div id="screen-create" class="screen">
        <div class="card">
            <div class="input-group">
                <label>Введите текст</label>
                <input type="text" id="emoji-text" class="input-field" placeholder="Ваш текст или эмодзи..." maxlength="20">
            </div>
            <div class="input-group">
                <label>Цвет заливки</label>
                <input type="color" id="emoji-color" value="#5b6cf9" style="width: 100%; height: 48px; border-radius: 12px; border: none; background: rgba(44,44,53,0.8); padding: 4px; cursor: pointer;">
            </div>
            <button class="btn" onclick="sendDataToBot()">Создать пак</button>
        </div>
    </div>

    <!-- Экран "Профиль" -->
    <div id="screen-profile" class="screen hidden">
        <div class="card">
            <p style="text-align: center; margin-bottom: 16px; font-size: 15px;">Баланс: 0 <span style="color: gold;">⭐</span></p>
            <button class="btn btn-secondary" onclick="sendAction('buy_stars')">Пополнить Telegram Stars</button>
            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="sendAction('buy_ton')">Пополнить TON</button>
        </div>
    </div>

    <!-- Экран "Розыгрыш" -->
    <div id="screen-giveaway" class="screen hidden">
        <div class="card">
            <h3 style="text-align: center;">Розыгрыш</h3>
            <p style="text-align: center; color: var(--secondary-text); margin-top: 8px;">Скоро здесь появятся призы!</p>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('create', this)">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            Создать
        </button>
        <button class="nav-item" onclick="switchTab('giveaway', this)">
            <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
            Розыгрыш
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
    </div>

    <script>
        // Безопасное получение объекта Telegram
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.expand();
            }
        } catch (e) {
            showError("Не удалось получить доступ к Telegram WebApp: " + e.message);
        }

        // Показать ошибку на экране
        function showError(msg) {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            box.innerText = '⚠ ' + msg;
            console.error(msg);
        }

        // Навигация
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnElement.classList.add('active');

            document.querySelectorAll('#screen-create, #screen-profile, #screen-giveaway').forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('screen');
            });

            const target = document.getElementById('screen-' + tabName);
            target.classList.remove('hidden');
            void target.offsetWidth;
            target.classList.add('screen');

            const titles = { create: 'Создать эмодзи', profile: 'Профиль', giveaway: 'Розыгрыш' };
            document.getElementById('page-title').innerText = titles[tabName];
        }

        // Отправка данных в бота
        function sendDataToBot() {
            try {
                const textEl = document.getElementById('emoji-text');
                const colorEl = document.getElementById('emoji-color');

                if (!textEl || !colorEl) {
                    showError("Не найдены поля ввода (emoji-text / emoji-color).");
                    return;
                }

                const text = textEl.value.trim();
                const color = colorEl.value;

                if (!text) {
                    if (tg && tg.showAlert) tg.showAlert("Введите текст!");
                    else alert("Введите текст!");
                    return;
                }

                if (!tg) {
                    showError("Telegram WebApp не доступен. Открой приложение через кнопку в боте, а не в браузере.");
                    return;
                }

                if (!tg.sendData) {
                    showError("Метод sendData не доступен. Возможно, старая версия Telegram.");
                    return;
                }

                tg.sendData(JSON.stringify({
                    action: 'create_emoji',
                    text: text,
                    color: color
                }));

                tg.close();
            } catch (e) {
                showError("Ошибка при отправке: " + e.message);
            }
        }

        // Отправка простого действия
        function sendAction(actionName) {
            try {
                if (!tg || !tg.sendData) {
                    showError("WebApp не доступен.");
                    return;
                }
                tg.sendData(JSON.stringify({ action: actionName }));
                tg.close();
            } catch (e) {
                showError("Ошибка: " + e.message);
            }
        }

        // === Анимированный фон с волнами ===
        (function initWaves() {
            const canvas = document.getElementById('waves-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width, height;
            let animationId;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const waves = [
                { amplitude: 60, length: 0.008, speed: 0.010, color: 'rgba(91, 108, 249, 0.35)', offset: 0, yBase: 0.55 },
                { amplitude: 45, length: 0.012, speed: 0.015, color: 'rgba(58, 75, 214, 0.30)',  offset: 2, yBase: 0.65 },
                { amplitude: 75, length: 0.006, speed: 0.007, color: 'rgba(40, 50, 160, 0.25)',  offset: 4, yBase: 0.75 },
                { amplitude: 35, length: 0.015, speed: 0.020, color: 'rgba(120, 140, 255, 0.20)', offset: 1, yBase: 0.85 },
            ];

            let time = 0;

            function drawWave(wave, t) {
                ctx.beginPath();
                const yBasePx = height * wave.yBase;
                ctx.moveTo(0, height);
                ctx.lineTo(0, yBasePx);

                for (let x = 0; x <= width; x += 4) {
                    const y = yBasePx
                        + Math.sin(x * wave.length + t * wave.speed + wave.offset) * wave.amplitude
                        + Math.sin(x * wave.length * 2.3 + t * wave.speed * 1.7 + wave.offset) * (wave.amplitude * 0.35);
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.closePath();

                const grad = ctx.createLinearGradient(0, yBasePx - wave.amplitude, 0, height);
                grad.addColorStop(0, wave.color);
                grad.addColorStop(1, 'rgba(10, 14, 26, 0)');
                ctx.fillStyle = grad;
                ctx.fill();
            }

            function animate() {
                time += 1;
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
                skyGrad.addColorStop(0, '#0a0e1a');
                skyGrad.addColorStop(0.5, '#0d1428');
                skyGrad.addColorStop(1, '#05080f');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height);

                for (const w of waves) drawWave(w, time);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                for (let i = 0; i < 30; i++) {
                    const sx = (Math.sin(i * 137.5 + time * 0.002) * 0.5 + 0.5) * width;
                    const sy = (Math.cos(i * 91.3 + time * 0.001) * 0.5 + 0.5) * height * 0.5;
                    const size = (Math.sin(i * 7 + time * 0.02) * 0.5 + 0.5) * 1.5 + 0.3;
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                animationId = requestAnimationFrame(animate);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) cancelAnimationFrame(animationId);
                else animate();
            });

            animate();
        })();
    </script>
</body>
</html>
